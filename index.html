<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js GLTF Idempotency Test</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            width: 100%;
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
            pointer-events: none;
        }
        #controls {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
        }
        button {
            padding: 8px 16px;
            margin: 0 5px;
            cursor: pointer;
        }
        #comparison {
            position: absolute;
            top: 50px;
            left: 10px;
            right: 10px;
            bottom: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-family: monospace;
            padding: 10px;
            overflow: auto;
            display: none;
            white-space: pre;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="info">Three.js GLTF Idempotency Test</div>
    <div id="controls">
        <button id="exportBtn">Export GLTF</button>
        <button id="compareBtn">Compare Original vs Exported</button>
        <button id="toggleViewBtn">Toggle View</button>
    </div>
    <div id="comparison"></div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
